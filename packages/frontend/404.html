<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1f2228" media="(prefers-color-scheme: dark)">
    <title>404 - Page Not Found | ShareBin</title>
    
    <!-- Fonts: Geist Mono & Inter -->
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <style>
        * { box-sizing: border-box; }
        .icon { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; }
        body { margin: 0; background-color: var(--bg, #ffffff); color: var(--fg, #111827); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        header { padding: 0 24px; border-bottom: 1px solid var(--border-subtle, rgba(17,24,39,0.12)); background-color: var(--bg, #ffffff); display: flex; justify-content: space-between; align-items: center; height: 64px; }
        .brand { font-family: 'Geist Mono', monospace; font-size: 14px; letter-spacing: 1.4px; text-transform: uppercase; text-decoration: none; color: var(--fg, #111827); display: flex; align-items: center; gap: 8px; }
        main { flex: 1; display: flex; flex-direction: column; background-color: var(--bg, #ffffff); }
        @media (prefers-color-scheme: dark) {
            body { background-color: var(--bg, #1f2228); color: var(--fg, #ffffff); }
            header { border-bottom-color: var(--border-subtle, rgba(255,255,255,0.15)); background-color: var(--bg, #1f2228); }
            .brand { color: var(--fg, #ffffff); }
            main { background-color: var(--bg, #1f2228); }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="brand"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> ShareBin</a>
    </header>
    
    <main style="background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 60px);">
        <div style="text-align: center; max-width: 500px; padding: var(--space-6);">
            <h1 style="font-size: 8rem; font-weight: 700; color: var(--text-secondary); margin: 0; font-family: var(--font-mono); line-height: 1;">404</h1>
            <h2 style="font-size: 1.5rem; font-weight: 600; margin: var(--space-4) 0; color: var(--fg);">Page Not Found</h2>
            <p style="color: var(--text-secondary); margin-bottom: var(--space-6); font-size: 1.1rem;">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <a href="/" class="btn" style="display: inline-flex; align-items: center; gap: 8px;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Back to Home
            </a>
        </div>
    </main>

    <!-- Load app styles -->
    <script type="module" src="/src/main-404.ts"></script>
</body>
</html>

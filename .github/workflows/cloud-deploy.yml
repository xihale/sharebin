name: Cloud Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/cloud/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/cloud-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/cloud/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/cloud-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sharebin-cloud
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Typecheck cloud
        run: bun run --filter @sharebin/cloud typecheck

      - name: Build cloud frontend
        run: bun run build:cloud

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -f apps/cloud/wrangler.jsonc
          bun run deploy:cloud
